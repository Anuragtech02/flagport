<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flagport dashboard</title>
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #050505; --panel: #101011; --ink: #F5F5F3; --muted: #A6A6A2; --line: #27272A;
    --on: #B8F020; --on-soft: #25300A; --off: #3A3A3D; --danger: #FF8A80; --accent: #D4FF3F;
    --mono: 'Geist Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 'Geist', system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 13px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button.link { border: 0; background: none; padding: 2px 4px; color: var(--muted); text-decoration: underline; }
  button.link.danger { color: var(--danger); }
  input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { font-family: var(--mono); font-size: 13px; min-height: 340px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }

  .shell { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--line); padding: 22px 14px; }
  .brand { display: block; color: inherit; text-decoration: none; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; padding: 0 8px 18px; }
  .brand span { color: var(--on); }
  nav .env { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px; border-radius: 8px; }
  nav .env.active { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
  nav .new { margin-top: 12px; width: 100%; }
  main { padding: 28px 34px 60px; max-width: 980px; width: 100%; }
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .live { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .dot.up { background: var(--on); box-shadow: 0 0 0 4px var(--on-soft); }
  .spacer { flex: 1; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .keyrow { display: flex; gap: 10px; align-items: center; }
  .keyrow code { flex: 1; overflow-wrap: anywhere; }
  .creds { padding: 4px 18px; }
  .cred { padding: 12px 0; border-top: 1px solid var(--line); }
  .cred:first-child { border-top: 0; }
  .cred summary { cursor: pointer; }
  .cred .sub { font-size: 12.5px; color: var(--muted); margin-left: 6px; }
  .cred .keyrow { margin-top: 10px; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }
  label.check input { width: auto; }
  pre { margin: 12px 0 0; padding: 12px 14px; background: var(--bg); border-radius: 8px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; }

  .flags { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .flag { display: grid; grid-template-columns: 52px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
  .flag:first-child { border-top: 0; }
  .flag .key { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
  .flag .sub { font-size: 12.5px; color: var(--muted); }
  .evals { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  .empty { padding: 26px 18px; color: var(--muted); }

  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--off); border: 0; padding: 0; position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--on); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 22px; width: min(640px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h3 { margin: 0 0 4px; font-size: 17px; }
  dialog p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .err { color: var(--danger); font-size: 13.5px; min-height: 20px; margin-top: 10px; }
  .login { max-width: 400px; margin: 14vh auto 0; padding: 0 16px; }
  .login .brand { padding-left: 0; }
  .login .or { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .login .or p { margin: 0 0 12px; }
  nav .foot { margin-top: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .start { margin-top: 14px; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }

  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    main { padding: 20px 16px 48px; }
    .flag { grid-template-columns: 52px 1fr; }
    .evals { text-align: left; grid-column: 2; }
    .flag .rowactions { grid-column: 2; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dialog"></dialog>
<div id="toast" role="status"></div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { key: null, signups: false, envs: [], current: null, env: null };

// The key stays in this browser until Sign out; nothing else can recover a workspace.
try { state.key = localStorage.getItem('flagport-key'); } catch {}

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    ...options,
    headers: { ...(state.key ? { authorization: 'Bearer ' + state.key } : {}), ...(options.body ? { 'content-type': 'application/json' } : {}) },
  });
  if (res.status === 401) { signOut(); throw new Error('That key is not valid.'); }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error || 'Request failed (' + res.status + ')');
  return body;
}

function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 2200);
}

function signIn(key) {
  state.key = key;
  try { localStorage.setItem('flagport-key', key); } catch {}
}

function signOut() {
  state.key = null;
  try { localStorage.removeItem('flagport-key'); } catch {}
  render();
}

function openDialog(html, onSubmit) {
  const dialog = $('#dialog');
  dialog.innerHTML = '<form method="dialog">' + html + '<div class="err"></div></form>';
  $('form', dialog).addEventListener('submit', async (event) => {
    event.preventDefault();
    if (event.submitter?.value === 'cancel') return dialog.close();
    try { await onSubmit(new FormData(event.target)); dialog.close(); }
    catch (e) { $('.err', dialog).textContent = e.message; }
  });
  dialog.querySelectorAll('[data-copy]').forEach((button) => button.addEventListener('click', async () => {
    await navigator.clipboard.writeText(button.dataset.copy);
    toast('Copied');
  }));
  dialog.showModal();
}

const dialogActions = (label) =>
  '<div class="actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok">' + label + '</button></div>';

// ---- Loading ---------------------------------------------------------------

async function loadEnvs() {
  state.envs = await api('/envs');
  if (!state.envs.some((e) => e.id === state.current)) state.current = state.envs[0]?.id ?? null;
  await loadEnv();
}

async function loadEnv() {
  state.env = state.current ? await api('/envs/' + state.current) : null;
  render();
}

// ---- Rendering -------------------------------------------------------------

function describeFlag(flag) {
  const show = (i) => JSON.stringify(flag.variations[i]);
  if (!flag.on) return 'Off · serving ' + show(flag.offVariation);
  const rules = flag.rules.length + flag.targets.length + flag.contextTargets.length;
  const fallback = flag.fallthrough.rollout ? 'a percentage rollout' : show(flag.fallthrough.variation);
  return 'On · ' + (rules ? rules + ' targeting rule' + (rules === 1 ? '' : 's') + ', then ' : 'serving ') + fallback;
}

function credential(title, label, value, snippet) {
  return `
    <details class="cred" ${title === 'Server SDKs' ? 'open' : ''}>
      <summary><strong>${title}</strong> <span class="sub">${label}</span></summary>
      <div class="keyrow"><code>${esc(value)}</code><button data-copy="${esc(value)}">Copy</button></div>
      <pre>${esc(snippet)}</pre>
    </details>`;
}

/** Which SDK families can see a flag, matching LaunchDarkly's per-flag setting. */
function audienceNote(flag) {
  const a = flag.clientSideAvailability;
  const browser = a?.usingEnvironmentId ?? flag.clientSide === true;
  const mobile = a?.usingMobileKey ?? true;
  if (browser && mobile) return '';
  if (!browser && !mobile) return ' · server SDKs only';
  return browser ? ' · not on mobile SDKs' : ' · not on browser SDKs';
}

function renderEvals(counts) {
  if (!counts) return 'No evaluations yet';
  return Object.entries(counts).map(([variation, n]) => esc(variation) + ' × ' + n.toLocaleString()).join(' · ');
}

function render() {
  const app = $('#app');
  if (!state.key) {
    app.innerHTML = `
      <form class="login" id="login">
        <a class="brand" href="/">flag<span>port</span></a>
        <h1>Open your workspace</h1>
        <label for="key">${state.signups ? 'Workspace key' : 'Admin token'}</label>
        <input id="key" name="key" type="password" autocomplete="current-password" required>
        <div class="actions"><button class="primary">Open</button></div>
        <div class="err"></div>
        ${state.signups ? `
        <div class="or">
          <p>New here? A workspace needs no account and no email. You get one key; keep it safe.</p>
          <button type="button" id="create-workspace">Create a workspace</button>
        </div>` : `<div class="or"><p>This instance is private. Sign in with the admin token it was deployed with.</p></div>`}
      </form>`;
    const fail = (e) => { state.key = null; render(); $('.err').textContent = e.message; };
    $('#login').addEventListener('submit', async (event) => {
      event.preventDefault();
      state.key = String(new FormData(event.target).get('key')).trim();
      try { await loadEnvs(); signIn(state.key); } catch (e) { fail(e); }
    });
    $('#create-workspace')?.addEventListener('click', async (event) => {
      event.target.disabled = true;
      try {
        const { key } = await api('/workspaces', { method: 'POST' });
        // Signed in before the key is shown, so closing the dialog early does not lose the workspace.
        signIn(key);
        await loadEnvs();
        openDialog(`
          <h3>Your workspace key</h3>
          <p>This key is the only way into your workspace. There are no accounts and no reset, and the server keeps only a hash of it. Save it in a password manager now.</p>
          <div class="keyrow" style="margin-top:14px"><code>${esc(key)}</code><button type="button" data-copy="${esc(key)}">Copy</button></div>
          <label class="check" style="margin-top:16px"><input type="checkbox" required> I have saved this key</label>
          <div class="actions"><button class="primary" value="ok">Open my workspace</button></div>`, async () => {});
      } catch (e) { fail(e); }
    });
    return;
  }

  const env = state.env;
  const flags = env ? Object.values(env.flags) : [];
  const origin = location.origin;
  const connected = env ? env.connections.server + env.connections.js + env.connections.mobile : 0;
  app.innerHTML = `
    <div class="shell">
      <nav>
        <a class="brand" href="/">flag<span>port</span></a>
        ${state.envs.map((e) => `<button class="env ${e.id === state.current ? 'active' : ''}" data-env="${esc(e.id)}">${esc(e.name)}</button>`).join('')}
        <button class="new" data-action="new-env">New environment</button>
        <div class="foot">
          <button class="link" data-action="copy-key">Copy workspace key</button>
          <button class="link" data-action="sign-out">Sign out</button>
        </div>
      </nav>
      <main>
        ${!env ? `<h1>No environments yet</h1><p>An environment holds a set of flags and has its own SDK keys. Most teams start with one called Production.</p><button class="primary start" data-action="new-env">New environment</button>` : `
        <div class="head">
          <h1>${esc(env.name)}</h1>
          <span class="live" title="${env.connections.server} server · ${env.connections.js} browser · ${env.connections.mobile} mobile"><span class="dot ${connected ? 'up' : ''}"></span>${connected} SDK${connected === 1 ? '' : 's'} connected</span>
          <span class="spacer"></span>
          <button data-action="import">Import from LaunchDarkly</button>
          <button class="primary" data-action="new-flag">New flag</button>
        </div>

        <h2>Connect your existing SDKs</h2>
        <div class="card creds">
          ${credential('Server SDKs', 'SDK key · keep secret', env.sdkKey,
`init('${env.sdkKey}', {
  streamUri: '${origin}',
  baseUri:   '${origin}',
  eventsUri: '${origin}',
});`)}
          ${credential('Browser SDKs', 'Client-side ID · safe to ship in web pages', env.clientSideId,
`LDClient.initialize('${env.clientSideId}', context, {
  baseUrl:   '${origin}',
  streamUrl: '${origin}',
  eventsUrl: '${origin}',
});`)}
          ${credential('Mobile SDKs', 'Mobile key', env.mobileKey,
`new ReactNativeLDClient('${env.mobileKey}', AutoEnvAttributes.Enabled, {
  baseUri:   '${origin}',
  streamUri: '${origin}',
  eventsUri: '${origin}',
});`)}
        </div>

        <h2>Flags · ${flags.length}</h2>
        <div class="flags">
          ${flags.length === 0 ? `<div class="empty">No flags yet. Create one, or import them from LaunchDarkly.</div>` : flags.map((flag) => `
            <div class="flag">
              <button class="switch" role="switch" aria-checked="${flag.on}" aria-label="Toggle ${esc(flag.key)}" data-toggle="${esc(flag.key)}"></button>
              <div><div class="key">${esc(flag.key)}</div><div class="sub">${esc(describeFlag(flag) + audienceNote(flag))}</div></div>
              <div class="evals">${renderEvals(env.evals[flag.key])}<br>last 7 days</div>
              <div class="rowactions">
                <button class="link" data-edit="${esc(flag.key)}">Edit</button>
                <button class="link danger" data-delete="${esc(flag.key)}">Delete</button>
              </div>
            </div>`).join('')}
        </div>
        <p style="margin-top:22px"><button class="link danger" data-action="delete-env">Delete this environment</button></p>`}
      </main>
    </div>`;
}

// ---- Actions ---------------------------------------------------------------

const saveFlag = (key, flag) => api('/envs/' + state.current + '/flags/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify(flag) });

document.addEventListener('click', async (event) => {
  const el = event.target.closest('button');
  if (!el || el.closest('dialog') || el.closest('#login')) return;
  const { env, toggle, edit, action } = el.dataset;
  if (el.closest('summary')) return;
  try {
    if (env) { state.current = env; await loadEnv(); }
    else if (toggle) {
      const flag = state.env.flags[toggle];
      await saveFlag(toggle, { ...flag, on: !flag.on });
      await loadEnv();
      toast(toggle + ' is now ' + (flag.on ? 'off' : 'on'));
    }
    else if (edit) {
      const { version, deleted, key, ...editable } = state.env.flags[edit];
      openDialog(`
        <h3>Edit <span class="mono">${esc(edit)}</span></h3>
        <p>Targeting rules in the SDK's own format. Connected SDKs get the change immediately.</p>
        <label for="json">Flag configuration</label>
        <textarea id="json" name="json" spellcheck="false">${esc(JSON.stringify(editable, null, 2))}</textarea>
        ${dialogActions('Save')}`, async (form) => {
          let parsed;
          try { parsed = JSON.parse(form.get('json')); } catch { throw new Error('That is not valid JSON.'); }
          await saveFlag(edit, parsed);
          await loadEnv();
          toast('Saved ' + edit);
        });
    }
    else if (el.dataset.delete) {
      const key = el.dataset.delete;
      openDialog(`
        <h3>Delete <span class="mono">${esc(key)}</span>?</h3>
        <p>SDKs will fall back to the default value in your code. This cannot be undone.</p>
        ${dialogActions('Delete flag')}`, async () => {
          await api('/envs/' + state.current + '/flags/' + encodeURIComponent(key), { method: 'DELETE' });
          await loadEnv();
          toast('Deleted ' + key);
        });
    }
    else if (action === 'new-env') {
      openDialog(`
        <h3>New environment</h3>
        <label for="name">Name</label>
        <input id="name" name="name" placeholder="Production" required maxlength="80">
        ${dialogActions('Create')}`, async (form) => {
          const created = await api('/envs', { method: 'POST', body: JSON.stringify({ name: form.get('name') }) });
          state.current = created.id;
          await loadEnvs();
        });
    }
    else if (action === 'new-flag') {
      openDialog(`
        <h3>New flag</h3>
        <p>Creates a true/false flag, switched off. Add targeting rules afterwards with Edit.</p>
        <label for="key">Key</label>
        <input id="key" name="key" class="mono" placeholder="new-checkout" required pattern="[A-Za-z0-9._\\-]+">
        <label class="check"><input type="checkbox" name="client" checked> Also available to browser and mobile SDKs</label>
        ${dialogActions('Create flag')}`, async (form) => {
          const key = form.get('key').trim();
          if (state.env.flags[key]) throw new Error('A flag with that key already exists.');
          const client = form.get('client') === 'on';
          await saveFlag(key, {
            on: false, variations: [true, false], fallthrough: { variation: 0 }, offVariation: 1,
            clientSideAvailability: { usingEnvironmentId: client, usingMobileKey: client },
          });
          await loadEnv();
        });
    }
    else if (action === 'import') {
      openDialog(`
        <h3>Import from LaunchDarkly</h3>
        <p>Copies flags, targeting rules and segments into this environment. The token is used once for this import and is not stored. A read-only token is enough.</p>
        <label for="apiToken">LaunchDarkly API access token</label>
        <input id="apiToken" name="apiToken" type="password" autocomplete="off" required>
        <label for="projectKey">Project key</label>
        <input id="projectKey" name="projectKey" class="mono" placeholder="default" required>
        <label for="environmentKey">Environment key</label>
        <input id="environmentKey" name="environmentKey" class="mono" placeholder="production" required>
        ${dialogActions('Import')}`, async (form) => {
          const result = await api('/envs/' + state.current + '/import', { method: 'POST', body: JSON.stringify(Object.fromEntries(form)) });
          await loadEnv();
          const skipped = result.skipped.length ? ', ' + result.skipped.length + ' skipped' : '';
          toast('Imported ' + result.imported.flags + ' flags and ' + result.imported.segments + ' segments' + skipped);
        });
    }
    else if (el.dataset.copy) { await navigator.clipboard.writeText(el.dataset.copy); toast('Copied'); }
    else if (action === 'delete-env') {
      openDialog(`
        <h3>Delete ${esc(state.env.name)}?</h3>
        <p>Its SDK key, client-side ID and mobile key stop working straight away, connected SDKs are cut off, and every flag in it is erased. This cannot be undone.</p>
        ${dialogActions('Delete environment')}`, async () => {
          const name = state.env.name;
          await api('/envs/' + state.current, { method: 'DELETE' });
          state.current = null;
          await loadEnvs();
          toast('Deleted ' + name);
        });
    }
    else if (action === 'copy-key') { await navigator.clipboard.writeText(state.key); toast('Workspace key copied'); }
    else if (action === 'sign-out') {
      openDialog(`
        <h3>Sign out?</h3>
        <p>This browser forgets your key. You need the key to get back in, and it cannot be recovered or reset.</p>
        ${dialogActions('Sign out')}`, async () => signOut());
    }
  } catch (e) { toast(e.message); }
});

// Whether this instance lets visitors create a workspace decides what the sign-in screen offers.
fetch('/api/instance').then((res) => res.json()).then((instance) => { state.signups = !!instance.signups; }).catch(() => {})
  .finally(() => (state.key ? loadEnvs().catch(() => {}) : render()));
</script>
</body>
</html>
